<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pelsas Papelería — Carrito</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Work+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#25425E">
<link rel="apple-touch-icon" href="img/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  .item{
    display:flex; justify-content:space-between; align-items:center;
    background:#fff; border-radius:14px; padding:12px 14px; margin:0 18px 10px;
    box-shadow:0 3px 10px rgba(37,66,94,0.08);
  }
  .item .nombre{ font-size:13.5px; font-weight:600; }
  .item .codigo{ font-family:'JetBrains Mono', monospace; font-size:10.5px; color:var(--ink-soft); }
  .item .nota-input{
    display:block; margin-top:5px; width:100%; max-width:180px;
    border:1px solid var(--border); border-radius:8px; padding:4px 8px;
    font-family:inherit; font-size:11.5px; color:var(--ink); background:var(--bg); outline:none;
  }
  .item .nota-input:focus{ border-color:var(--accent); }
  .item .cantidad{ font-family:'JetBrains Mono', monospace; font-size:12.5px; }
  .qty{
    display:flex; align-items:center; gap:0; border:1.5px solid var(--border);
    border-radius:10px; overflow:hidden;
  }
  .qty button{
    background:var(--bg); border:none; width:26px; height:26px;
    font-size:15px; font-weight:700; color:var(--ink); line-height:1;
  }
  .qty button:active{ background:var(--border); }
  .qty input{
    width:32px; height:26px; border:none; border-left:1.5px solid var(--border);
    border-right:1.5px solid var(--border); text-align:center;
    font-family:'JetBrains Mono', monospace; font-size:12.5px; color:var(--ink);
    background:#fff; outline:none;
  }
  .item button.quitar{ background:none; border:none; color:#c0392b; font-size:12px; font-weight:600; }
  .resumen{
    margin:18px 18px 10px; padding:14px 16px; background:#fff; border-radius:14px;
    display:flex; justify-content:space-between; align-items:center;
    font-family:'Bricolage Grotesque', sans-serif; font-weight:700;
    box-shadow:0 3px 10px rgba(37,66,94,0.08);
  }
  .btn-whatsapp{
    display:block; margin:14px 18px; padding:14px; text-align:center;
    background:#25D366; color:#fff; border-radius:14px; font-weight:700;
    font-family:'Bricolage Grotesque', sans-serif;
  }
  .btn-guardar{
    display:block; width:calc(100% - 36px); margin:0 18px 14px; padding:12px;
    text-align:center; background:#fff; color:var(--ink); border:1.5px solid var(--border);
    border-radius:14px; font-weight:600; font-size:13px; cursor:pointer;
    font-family:'Work Sans', sans-serif;
  }
  .btn-seguir{
    display:block; text-align:center; margin:0 18px 24px;
    font-size:13px; color:var(--ink-soft); font-weight:600;
  }
  .vacio{ text-align:center; padding:60px 20px; color:var(--ink-soft); font-size:14px; }
</style>
</head>
<body>
<div class="app">

  <div class="catbar">
    <button class="back" onclick="volverAlCatalogo()">
      <svg viewBox="0 0 24 24" fill="none" stroke="#25425E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <span class="title">Tu carrito</span>
  </div>

  <div id="items"></div>
  <div id="resumenWrap"></div>

</div>

<script src="js/cart.js"></script>
<script>
  // Número de WhatsApp de Fer — ya usado en tus otras apps.
  const NUMERO_WHATSAPP = '59899886225';

  function render(){
    const items = cartGet();
    const itemsEl = document.getElementById('items');
    const resumenEl = document.getElementById('resumenWrap');

    if(items.length === 0){
      itemsEl.innerHTML = '<div class="vacio">Todavía no agregaste productos.</div>';
      resumenEl.innerHTML = '';
      return;
    }

    itemsEl.innerHTML = items.map((i,idx) => `
      <div class="item">
        <div>
          <div class="nombre">${i.nombre}</div>
          <div class="codigo">${i.codigo} · ${i.categoria}${i.modalidad && i.modalidad !== 'unidad' ? ' · por ' + i.modalidad : ''}</div>
          <input class="nota-input" placeholder="Color o detalle (opcional)" value="${i.nota || ''}" onchange="cartSetNota(${idx}, this.value)">
        </div>
        <div style="display:flex; align-items:center; gap:10px;">
          <div class="qty">
            <button type="button" onclick="cartSetCantidad(${idx}, ${i.cantidad} - 1); render();">−</button>
            <input type="number" min="1" value="${i.cantidad}" onchange="cartSetCantidad(${idx}, parseInt(this.value) || 1); render();">
            <button type="button" onclick="cartSetCantidad(${idx}, ${i.cantidad} + 1); render();">+</button>
          </div>
          <button class="quitar" onclick="quitar(${idx})">Quitar</button>
        </div>
      </div>
    `).join('');

    resumenEl.innerHTML = `
      <div class="resumen"><span>Total</span><span>$${cartTotal()}</span></div>
      <a class="btn-whatsapp" href="${cartBuildWhatsAppLink(NUMERO_WHATSAPP)}" target="_blank">Enviar pedido por WhatsApp</a>
      <button class="btn-guardar" onclick="cartDownloadTxt()">Guardar pedido en este dispositivo</button>
      <a class="btn-seguir" href="${urlUltimaPagina()}">← Seguir comprando</a>
    `;
  }

  function volverAlCatalogo(){
    window.location.href = urlUltimaPagina();
  }

  function urlUltimaPagina(){
    try{
      const u = JSON.parse(localStorage.getItem('pp_ultima_pagina'));
      if(u && u.cat) return `catalogo.html?cat=${u.cat}&pagina=${u.pagina}`;
    }catch(e){}
    return 'index.html';
  }

  function quitar(index){
    cartRemove(index);
    render();
  }

  document.addEventListener('DOMContentLoaded', render);
</script>
<script src="js/pwa.js"></script>
</body>
</html>
