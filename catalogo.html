<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pelsas Papelería — Catálogo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Work+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=7">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#25425E">
<link rel="apple-touch-icon" href="img/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>
<div class="app">

  <div class="catbar">
    <button class="back" onclick="window.location.href='index.html'">
      <svg viewBox="0 0 24 24" fill="none" stroke="#25425E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <span class="title" id="titulo">Cargando…</span>
  </div>

  <div class="tipos-bar" id="tiposBar"></div>

  <div class="hint-banner" id="hintBanner" style="display:none;">
    <span class="icon">👆</span> Tocá un producto en la imagen para agregarlo al pedido
  </div>

  <div id="paginas"></div>

  <div class="overlay-tipos" id="overlayTipos" style="display:none;">
    <div class="overlay-panel">
      <div class="overlay-header">
        <span class="overlay-titulo" id="overlayTitulo">Bolígrafos</span>
        <button class="overlay-cerrar" id="overlayCerrar" aria-label="Cerrar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="overlay-orden">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h11M3 12h7M3 17h4"/><path d="M17 4v16M17 4l3 3M17 4l-3 3"/></svg>
        <select id="overlaySelectOrden">
          <option value="precio-asc">Precio: menor a mayor</option>
          <option value="precio-desc">Precio: mayor a menor</option>
        </select>
      </div>
      <div class="overlay-grid" id="overlayGrid"></div>
    </div>
  </div>

  <div class="modal-detalle" id="modalDetalle" style="display:none;">
    <div class="modal-detalle-panel">
      <button class="detalle-cerrar" id="detalleCerrar" aria-label="Cerrar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
      <div class="detalle-foto" id="detalleFotoWrap"></div>
      <div class="detalle-info">
        <div class="detalle-marca" id="detalleMarca"></div>
        <div class="detalle-nombre" id="detalleNombre"></div>
        <div class="detalle-codigo" id="detalleCodigo"></div>
        <div class="detalle-precios">
          <span class="detalle-precio-ref" id="detallePrecioRef" style="display:none;"></span>
          <span class="detalle-precio-principal" id="detallePrecioPrincipal"></span>
        </div>
        <button class="detalle-btn-agregar" id="detalleBtnAgregar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
          Agregar al carrito
        </button>
      </div>
    </div>
  </div>

</div>

<button class="scroll-top-btn" id="scrollTopBtn" aria-label="Subir">
  <svg viewBox="0 0 24 24" fill="none" stroke="#25425E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
</button>

<div class="bottomnav">
  <button class="navitem" onclick="window.location.href='index.html'">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><path d="M9 22V12h6v10"></path></svg>
    Inicio
  </button>
  <button class="navitem" onclick="window.location.href='index.html'">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="14" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect></svg>
    Categorías
  </button>
  <button class="navitem" onclick="window.location.href='index.html?buscar=1'">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><path d="M21 21l-4.35-4.35"></path></svg>
    Buscar
  </button>
  <button class="navitem" onclick="window.location.href='carrito.html'" style="position:relative;">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
    <span class="nav-badge">0</span>
    Carrito
  </button>
</div>

<script src="js/cart.js"></script>
<script src="js/catalogo.js?v=7"></script>
<script src="js/pwa.js"></script>
</body>
</html>
