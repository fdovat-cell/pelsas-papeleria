<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pelsas Papelería — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Work+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  #app-admin{ max-width:560px; margin:0 auto; padding:24px 18px 60px; }

  .login-box{
    max-width:320px; margin:80px auto 0; background:#fff; padding:28px 24px;
    border-radius:16px; box-shadow:0 6px 20px rgba(37,66,94,0.14); text-align:center;
  }
  .login-box h1{ font-family:'Bricolage Grotesque', sans-serif; font-size:17px; margin-bottom:20px; }
  .login-box input{
    display:block; width:100%; margin-bottom:10px; padding:11px 12px;
    border:1px solid #ddd; border-radius:10px; font-size:14px; font-family:'Work Sans', sans-serif;
  }
  .login-box button{
    width:100%; padding:11px; background:var(--accent); color:#fff; border:none;
    border-radius:10px; font-weight:700; font-family:'Bricolage Grotesque', sans-serif; cursor:pointer;
  }
  .login-box .error{ color:#c0392b; font-size:12.5px; margin-top:10px; min-height:16px; }

  .topbar-admin{ display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; }
  .topbar-admin h1{ font-family:'Bricolage Grotesque', sans-serif; font-size:19px; }
  .topbar-admin button{
    background:none; border:1px solid var(--ink-soft); color:var(--ink-soft);
    padding:6px 12px; border-radius:8px; font-size:12.5px; cursor:pointer;
  }

  .selector{ display:flex; flex-direction:column; gap:10px; margin-bottom:18px; }
  .selector select{
    padding:10px 12px; border-radius:10px; border:1px solid #ddd; font-size:14px;
    font-family:'Work Sans', sans-serif; background:#fff;
  }
  .filtro{ font-size:13px; color:var(--ink-soft); display:flex; align-items:center; gap:6px; }

  .fila-producto{
    display:flex; align-items:center; gap:10px; background:#fff; border-radius:12px;
    padding:10px 12px; margin-bottom:8px; box-shadow:0 2px 6px rgba(37,66,94,0.08);
  }
  .fila-producto .info{ flex:1; display:flex; flex-direction:column; }
  .fila-producto .codigo{ font-family:'JetBrains Mono', monospace; font-size:13px; font-weight:600; }
  .fila-producto .pagina{ font-size:11px; color:var(--ink-soft); }
  .input-precio{
    width:80px; padding:7px 8px; border:1px solid #ddd; border-radius:8px;
    font-family:'JetBrains Mono', monospace; font-size:13px; text-align:right;
  }
  .btn-guardar{
    background:var(--accent); color:#fff; border:none; padding:8px 12px;
    border-radius:8px; font-size:12.5px; font-weight:600; cursor:pointer;
  }
  .estado{ font-size:11.5px; color:var(--ink-soft); min-width:70px; }
  .vacio{ text-align:center; color:var(--ink-soft); font-size:13.5px; padding:30px 0; }
</style>
</head>
<body>
<div id="app-admin">Cargando…</div>
<script src="js/admin.js"></script>
</body>
</html>
